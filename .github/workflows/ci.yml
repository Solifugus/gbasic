# CI exists because of a specific, measured failure: on 2026-08-15 gBASIC did not
# build AT ALL on Ubuntu 24.04 LTS or 25.04 when the optional dependencies were
# present, and a 216-example / 303-negative-case suite did not notice, because a
# `#if HAVE_*` guard and a `pkg-config --exists` check are both blind to the
# configuration they did not select. Three separate defects had accumulated that
# way, one of them for three weeks.
#
# So the matrix is not about breadth for its own sake. Each job is a
# configuration that was actually broken and could not be seen from a developer
# machine:
#
#   full      every optional module enabled -- catches the link/compile errors
#             that only appear when a module is COMPILED, e.g. the GTK 3 gui
#             module, which no local build here compiles at all.
#   minimal   nothing optional -- catches the opposite: code that assumes a
#             library is present, and suites that fail cases for correctly
#             reporting a module is absent (34 of 182 examples once did).
#   older     the current LTS, whose library VERSIONS differ from a dev box.
#             gi_repository_dup_default and libxml2's const change were both
#             version defects, not missing-dependency defects.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: all optional modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # NOTE: libcrypt-dev, not libxcrypt-dev, and libgirepository-2.0-dev,
          # not libgirepository1.0-dev. Both wrong names were in check-deps.sh
          # until 2026-08-15; because --install issues a single apt-get, one bad
          # name meant nothing was installed at all.
          sudo apt-get install -y -qq \
            build-essential bison pkg-config \
            zlib1g-dev libxml2-dev libsqlite3-dev libpq-dev \
            libcurl4-openssl-dev libssl-dev libcrypt-dev \
            libgtk-3-dev libgirepository-2.0-dev libglib2.0-dev

      - name: Report what was detected
        run: ./tools/check-deps.sh

      - name: Build everything
        run: make dev

      - name: Version
        run: ./gbasic --version

      - name: Run every suite
        run: |
          status=0
          for s in tests/run_*.sh; do
            printf '\n===== %s =====\n' "$s"
            if ! timeout 2400 bash "$s"; then
              printf '::error::%s failed\n' "$s"
              status=1
            fi
          done
          printf '\n===== tests/lsp/run_lsp.sh =====\n'
          timeout 600 bash tests/lsp/run_lsp.sh || status=1
          exit "$status"

  minimal:
    name: no optional modules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT installing pkg-config: without it the Makefile disables
      # every optional module, which is the leanest configuration anyone can
      # build and the one a source release must still work in.
      - name: Install only what is required
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison

      - name: Build
        run: make

      # A NON-INTERACTIVE smoke. Not the adventure example: at EOF on stdin it
      # loops rather than exiting, so it hangs the job until the runner's own
      # timeout -- measured, not guessed.
      - name: The interpreter must still work
        run: |
          ./gbasic --version
          printf 'program main()\n    print "hello from a minimal build"\nend program\n' > /tmp/smoke.bas
          timeout 60 ./gbasic /tmp/smoke.bas

      # The suites must SKIP the module-dependent cases, not fail them. This is
      # the tier that would have caught "34 of 182 examples fail on a build with
      # no optional dependencies", which was true and unnoticed until 2026-08-15.
      - name: Suites must skip, not fail
        run: |
          # pipefail, not just -e: a suite piped into `tail` reports TAIL's exit
          # status, so a failing suite reads as a pass. That is how rc2 was
          # tagged while run_examples.sh was red (2026-08-20).
          set -eo pipefail
          bash tests/run_examples.sh | tail -5
          bash tests/run_negative.sh | tail -5
          bash tests/run_xlsx.sh
          bash tests/run_xlsx_cookbook.sh

  install:
    name: install to a prefix and run from it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bison pkg-config \
            zlib1g-dev libxml2-dev libsqlite3-dev

      # The stdlib path is COMPILED IN, so `make` followed by `make install
      # PREFIX=...` used to install a binary still pointing at /usr/local. It
      # failed silently: `load` either failed later for no visible reason, or
      # resolved against a different gBASIC's stdlib. Build first, deliberately,
      # so this job exercises that exact sequence.
      - name: Build, then install elsewhere
        run: |
          make
          make install PREFIX="$HOME/.local"
          make install-lsp PREFIX="$HOME/.local"

      - name: The installed binary must find its own stdlib
        run: |
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          printf 'program main()\n    load stats\n    print "stdlib resolved"\nend program\n' > t.bas
          env -u GBASIC_PATH "$HOME/.local/bin/gbasic" t.bas
          test -f "$HOME/.local/share/doc/gbasic/LICENSE"
          test -f "$HOME/.local/share/doc/gbasic/NOTICE"

      - name: Uninstall must leave nothing behind
        run: |
          cd "$GITHUB_WORKSPACE"
          make uninstall PREFIX="$HOME/.local"
          ! test -e "$HOME/.local/bin/gbasic"
          ! test -e "$HOME/.local/share/gbasic"
          ! test -e "$HOME/.local/share/doc/gbasic"

  # ---------------------------------------------------------------------------
  # macOS: AN EXPLORATION, NOT A GATE.
  #
  # gBASIC has never been built on a Mac. docs and README say Linux only, and
  # that claim has never been MEASURED -- nobody here owns a Mac. A hosted
  # runner is how it becomes a fact instead of a caveat, and the answer decides
  # something real for the book: if a Mac reader can have a NATIVE BINARY, the
  # whole VM-appliance question goes away for Volume 1.
  #
  # `continue-on-error` so the steps fail HONESTLY while master stays green.
  # This job's output is a report, and a report that cannot fail says nothing.
  #
  # MEASURED FROM THE SOURCE before writing it, so the log can be read against a
  # known list -- the Linux-specific surface is THREE mechanisms in two files:
  #   SOCK_SEQPACKET      actor mailboxes; AF_UNIX has no SEQPACKET on macOS,
  #                       and SOCK_DGRAM is the candidate (it keeps message
  #                       boundaries, which is the property relied on)
  #   /proc/self/exe      re-exec path; macOS is _NSGetExecutablePath()
  #   PR_SET_PDEATHSIG    "nothing this interpreter started outlives it", which
  #                       docs/reference.md states in bold and
  #                       run_process_lifetime.sh tests. macOS has no
  #                       equivalent; it needs kqueue NOTE_EXIT, and this is the
  #                       one with a design decision in it rather than a
  #                       mechanical substitution.
  # The event loop already uses poll(), not epoll -- which is usually the thing
  # that blocks a port, and it is already portable.
  #
  # ON DEMAND ONLY. macOS runner minutes bill at 10x the Linux rate against the
  # included quota for a PRIVATE repository (they are free for a public one). To
  # run it on every push to master, add `push:` back to `on:` below -- a
  # deliberate edit, not a default that surprises somebody with a bill.
  macos-exploration:
    name: macOS (exploration -- never gates)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: What machine is this
        run: |
          uname -a
          sw_vers || true
          cc --version | head -3

      - name: Install dependencies
        run: |
          # macOS ships bison 2.3 (2006, GPLv2) and the grammar needs 3.x, so
          # the brew one has to come FIRST on PATH -- a build that silently used
          # /usr/bin/bison would fail with a grammar error that names the
          # grammar and not the tool.
          brew install bison pkg-config sqlite libxml2 openssl@3 zlib || true
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Which bison
        run: |
          which bison
          bison --version | head -1

      - name: What does the build think it has
        run: ./tools/check-deps.sh || true

      - name: Build
        run: make

      - name: Does it run at all
        run: |
          ./gbasic --version
          printf 'print "hello from macOS"\n' > /tmp/hello.bas
          ./gbasic /tmp/hello.bas

      - name: The prompt
        run: printf 'x = 2\nprint x * 21\nquit\n' | ./gbasic --repl

      - name: Every suite
        run: ./tests/run_all.sh
