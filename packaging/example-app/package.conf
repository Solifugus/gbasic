NAME="notesd"
VERSION="0.1.0"
SUMMARY="Minimal gBASIC service, used to prove the packaging path"
MAINTAINER="Matthew C. Tedder <matthewct@gmail.com>"
ENTRY="notesd.bas"

# Runtime dependencies. These are the SYSTEM libraries the lean interpreter
# links -- deliberately not vendored, so the distribution patches them.
DEPENDS="libc6, libsqlite3-0, zlib1g"

# The lean build. Everything this application does not use is compiled out:
# no GTK, no GObject-introspection, no PostgreSQL, no libxml2, no libcurl.
BUILD_FLAGS="GTK_AVAILABLE=0 GIR_AVAILABLE=0 GIO_AVAILABLE=0 LIBPQ_AVAILABLE=0 LIBXML2_AVAILABLE=0 LIBCURL_AVAILABLE=0"
