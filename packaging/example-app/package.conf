NAME="notesd"
VERSION="0.1.0"
SUMMARY="Minimal gBASIC service, used to prove the packaging path"
MAINTAINER="Matthew C. Tedder <matthewct@gmail.com>"
ENTRY="notesd.bas"

# Runtime dependencies. These are the SYSTEM libraries the lean interpreter
# links -- deliberately not vendored, so the distribution patches them.
DEPENDS="libc6, libsqlite3-0, zlib1g"

# The lean build. Everything this application does not use is compiled out, and
# the list is EVERY optional switch the Makefile has except the two above --
# which is the fix for a defect this file shipped with.
#
# IT USED TO NAME SIX, and the other five were off only because the build
# machine happened not to have them installed. Measured 2026-10-09, on a machine
# that does: the "lean" interpreter linked libldap, liblber, libsasl2, libodbc,
# libltdl, libcrypto, libssl and libcrypt -- EIGHT libraries this application
# does not use and `DEPENDS` above does not declare. So the package said it
# needed libc6, libsqlite3-0 and zlib1g while the binary needed eleven, and on a
# machine without them the installed service would not have started at all.
#
# Found when CI began installing unixODBC and libldap and run_packaging's
# ceiling went 15 -> 23 shared libraries. The ceiling was guarding the DEPENDS
# defect incidentally; a tripwire in that suite now guards the list itself, so a
# new optional dependency cannot join a lean build in silence.
#
# 15 shared libraries before, 6 after: libc, libm, libsqlite3, libz -- exactly
# what DEPENDS names.
BUILD_FLAGS="GTK_AVAILABLE=0 GIR_AVAILABLE=0 GIO_AVAILABLE=0 LIBPQ_AVAILABLE=0 LIBXML2_AVAILABLE=0 LIBCURL_AVAILABLE=0 ODBC_AVAILABLE=0 LDAP_AVAILABLE=0 LIBCRYPTO_AVAILABLE=0 LIBSSL_AVAILABLE=0 LIBXCRYPT_AVAILABLE=0"
