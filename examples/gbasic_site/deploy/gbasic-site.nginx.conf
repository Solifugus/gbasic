# Example nginx site for the gBASIC Postgres sample app.
#
# Replace gbasic.example.org, certificate paths, and /srv/gbasic with the
# values for the target server. The gBASIC app should listen on loopback using
# GBASIC_SITE_PORT=8080 or examples/gbasic_site/server_port.txt.

server {
    listen 80;
    server_name gbasic.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gbasic.example.org;

    ssl_certificate /etc/letsencrypt/live/gbasic.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gbasic.example.org/privkey.pem;

    access_log /var/log/nginx/gbasic-site.access.log;
    error_log /var/log/nginx/gbasic-site.error.log;

    client_max_body_size 64k;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    location /static/ {
        alias /srv/gbasic/examples/gbasic_site/static/;
        try_files $uri =404;
        expires 1h;
    }

    # Keep admin unreachable publicly until production auth/session work lands.
    location /admin {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
